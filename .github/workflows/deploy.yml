name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 云端开关：从 GitHub Actions Secrets 注入（不写进公开仓库，遵守隐私红线）。
          # 需在 Repo Settings → Secrets and variables → Actions 中新增以下 4 个 repository secret：
          #   VITE_TCB_ENV               = ai-navigator-k-d8g7vx3dn6bcbc310
          #   VITE_AI_VERIFY_HTTP_URL    = https://ai-navigator-k-d8g7vx3dn6bcbc310.service.tcloudbase.com/ai-verify
          #   VITE_TEAMMATE_HTTP_URL     = https://ai-navigator-k-d8g7vx3dn6bcbc310.service.tcloudbase.com/teammate-ops
          #   VITE_BEHAVIORS_HTTP_URL    = https://ai-navigator-k-d8g7vx3dn6bcbc310.service.tcloudbase.com/behaviors
          VITE_TCB_ENV: ${{ secrets.VITE_TCB_ENV }}
          VITE_AI_VERIFY_HTTP_URL: ${{ secrets.VITE_AI_VERIFY_HTTP_URL }}
          VITE_TEAMMATE_HTTP_URL: ${{ secrets.VITE_TEAMMATE_HTTP_URL }}
          VITE_BEHAVIORS_HTTP_URL: ${{ secrets.VITE_BEHAVIORS_HTTP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

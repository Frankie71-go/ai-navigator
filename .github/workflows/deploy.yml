name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        # ⚠️ 隐私红线：公开版（GitHub Pages）恒为「0 凭证模板版」，绝不在此注入任何 envId / 后端地址。
        # 个人版（本地或私有部署）通过 .env.local 注入凭证；.env.local 已被 .gitignore 排除，不进入公开仓库。
        # 因此此处不设置任何 VITE_* 环境变量 —— 公开构建产物不含任何云端凭证，符合「公开版 0 凭证」设计。
        # 若需公开版连接你自己的后端，请 fork 后在私有仓库 Settings → Secrets 中自行配置，勿推回本公开仓库。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
